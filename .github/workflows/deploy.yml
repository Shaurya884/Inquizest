name: Deploy INQUIZEST to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Inspect build output
        run: |
          echo "================================"
          echo "ROOT DIRECTORY"
          echo "================================"
          ls -la

          echo ""
          echo "================================"
          echo "DIST DIRECTORY"
          echo "================================"
          ls -la dist || true

          echo ""
          echo "================================"
          echo "BUILD DIRECTORIES"
          echo "================================"
          find . -maxdepth 4 -type d \( \
            -name "dist" -o \
            -name "build" -o \
            -name "client" \
          \) -print

          echo ""
          echo "================================"
          echo "FILES INSIDE DIST"
          echo "================================"
          find dist -maxdepth 4 -type f -print 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
