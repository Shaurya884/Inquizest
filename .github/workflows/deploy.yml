name: Deploy INQUIZEST to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -e

          echo "Searching for browser output..."

          rm -rf site
          mkdir -p site

          # Look for the normal Vite/TanStack output first.
          if [ -d "dist" ]; then
            echo "Found dist/"
            cp -R dist/. site/
          elif [ -d ".output/public" ]; then
            echo "Found .output/public/"
            cp -R .output/public/. site/
          else
            echo "No standard output directory found."
            echo ""
            echo "Searching for index.html and _shell.html..."
            
            FOUND_FILE=""

            FOUND_FILE=$(find . \
              -type f \
              \( -name "index.html" -o -name "_shell.html" \) \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              | head -n 1)

            if [ -z "$FOUND_FILE" ]; then
              echo "ERROR: Could not find a browser entry file."
              echo ""
              echo "Build directory contents:"
              find . -maxdepth 4 -type f \
                -not -path "./node_modules/*" \
                -not -path "./.git/*" \
                | head -n 300
              exit 1
            fi

            echo "Found: $FOUND_FILE"

            FOUND_DIR=$(dirname "$FOUND_FILE")
            cp -R "$FOUND_DIR"/. site/
          fi

          # TanStack Start SPA builds can use _shell.html.
          # GitHub Pages needs index.html as the entry point.
          if [ ! -f "site/index.html" ] && [ -f "site/_shell.html" ]; then
            echo "Creating index.html from _shell.html"
            cp site/_shell.html site/index.html
          fi

          # GitHub Pages SPA fallback.
          if [ -f "site/index.html" ]; then
            cp site/index.html site/404.html
          fi

          echo ""
          echo "================================"
          echo "FINAL SITE CONTENT"
          echo "================================"
          find site -maxdepth 3 -type f -print | head -n 300

          echo ""
          echo "================================"
          echo "SITE SIZE"
          echo "================================"
          du -sh site

          if [ ! -f "site/index.html" ]; then
            echo "ERROR: site/index.html was not created."
            exit 1
          fi

          echo ""
          echo "SUCCESS: GitHub Pages site prepared."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
